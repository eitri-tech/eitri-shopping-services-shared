fragment CustomerAddressFields on CustomerAddress {
	id
	address1
	address2
	city
	province
	country
	zip
	phoneNumber
	firstName
	lastName
}

fragment CustomerFields on Customer {
	id
	firstName
	lastName
	displayName
	creationDate
	emailAddress {
		emailAddress
	}
	phoneNumber {
		phoneNumber
	}
	defaultAddress {
		...CustomerAddressFields
	}
	addresses(first: 10) {
		edges {
			node {
				...CustomerAddressFields
			}
		}
	}
}

fragment MoneyV2Fields on MoneyV2 {
	amount
	currencyCode
}

fragment OrderFields on Order {
	id
	name
	number
	processedAt
	createdAt
	financialStatus
	fulfillmentStatus
	totalPrice {
		...MoneyV2Fields
	}
	subtotal {
		...MoneyV2Fields
	}
	totalShipping {
		...MoneyV2Fields
	}
	totalTax {
		...MoneyV2Fields
	}
}

fragment LineItemFields on LineItem {
	id
	title
	quantity
	image {
		url
		altText
	}
	price {
		...MoneyV2Fields
	}
}

fragment CustomerUserErrorFields on CustomerUserError {
	code
	field
	message
}
