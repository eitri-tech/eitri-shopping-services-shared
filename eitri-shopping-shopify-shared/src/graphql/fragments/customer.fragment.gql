fragment CustomerAddressFields on CustomerAddress {
	id
	address1
	address2
	city
	province
	country
	zip
	phoneNumber
	firstName
	lastName
	territoryCode
	zoneCode
}

fragment CustomerFields on Customer {
	id
	firstName
	lastName
	displayName
	creationDate
	emailAddress {
		emailAddress
	}
	phoneNumber {
		phoneNumber
	}
	defaultAddress {
		...CustomerAddressFields
	}
	addresses(first: 10) {
		edges {
			node {
				...CustomerAddressFields
			}
		}
	}
}

fragment MoneyV2Fields on MoneyV2 {
	amount
	currencyCode
}


